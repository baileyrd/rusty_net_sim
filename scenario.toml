seed = 42
tick_rate_hz = 60
tick_count = 3600  # 60s at 60Hz
output_path = "metrics.jsonl"
replay_path = "replay.jsonl"  # optional; positions for an animated replay viewer

# Peer-to-peer ring link (phase 2, PeerPublishSource) — deliberately much
# better than most of the server links below, to see whether trusting a
# peer would have helped a high-latency client.
[peer]
latency_ms = 5
jitter_ms = 1
loss_pct = 0.0

[[clients]]
id = "c1"
latency_ms = 20
jitter_ms = 5
loss_pct = 0.0

[[clients]]
id = "c2"
latency_ms = 80
jitter_ms = 25
loss_pct = 1.0

[[clients]]
id = "c3"
latency_ms = 40
jitter_ms = 10
loss_pct = 0.5

[[clients]]
id = "c4"
latency_ms = 150
jitter_ms = 60
loss_pct = 3.0

[[clients]]
id = "c5"
latency_ms = 15
jitter_ms = 3
